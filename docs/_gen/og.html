<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <title>MacFan OG Poster</title>
  <link rel="stylesheet" href="poster.css" />
  <style>
    body { width: 1200px; height: 630px; }
    .mat { height: 100%; display: grid; grid-template-columns: 1.15fr 0.85fr; }
    .copy { padding: 72px 56px; display: flex; flex-direction: column; justify-content: center; }
    .brand { font-family: var(--display); font-size: 92px; font-weight: 900; letter-spacing: -0.05em; line-height: 0.82; }
    .brand em { font-style: normal; color: var(--accent); }
    .tag { margin-top: 22px; font-size: 22px; color: #5c646a; line-height: 1.4; max-width: 460px; }
    .meta { margin-top: 28px; font-family: var(--display); font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase; color: #8a9094; }
    .preview { display: grid; place-items: center; }
    .icon { width: 196px; height: 196px; border-radius: 44px; }
  </style>
</head>
<body class="poster">
  <div class="photo mist" style="background-image:url('bg/hard.jpg')"></div>
  <div class="veil"></div>
  <div class="grain"></div>
  <div class="mat">
    <div class="copy">
      <div class="brand">Mac<br><em>Fan</em></div>
      <p class="tag">原生风扇控制。实机读数，一键授权写入 SMC。</p>
      <div class="meta">v1.1.6 · Universal Binary · macOS 14+</div>
    </div>
    <div class="preview">
      <img class="icon" src="../assets/logo-512.png" alt="" />
    </div>
  </div>
</body>
</html>
