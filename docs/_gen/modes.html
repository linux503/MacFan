<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <title>MacFan Modes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="base.css" />
  <style>
    body {
      width: 1400px; height: 900px;
      padding: 48px 56px;
      background:
        radial-gradient(ellipse 70% 50% at 85% 15%, rgba(79, 156, 255, 0.14), transparent 55%),
        radial-gradient(ellipse 40% 35% at 5% 95%, rgba(224, 122, 106, 0.08), transparent 50%),
        linear-gradient(160deg, #0a1019 0%, #070b12 45%, #0d1420 100%);
    }
    header { margin-bottom: 36px; }
    header h1 {
      font-family: Outfit, Noto Sans SC, sans-serif;
      font-size: 42px; font-weight: 800; letter-spacing: -0.03em;
    }
    header p { font-size: 16px; color: var(--mist); margin-top: 10px; }
    .grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 22px; height: calc(100% - 130px);
    }
    .card {
      border-radius: 22px; padding: 28px 30px; border: 1px solid var(--line-strong);
      background: linear-gradient(155deg, rgba(24, 34, 51, 0.95), rgba(13, 20, 32, 0.88));
      display: flex; flex-direction: column; position: relative; overflow: hidden;
    }
    .card::after {
      content: ""; position: absolute; width: 220px; height: 220px; border-radius: 50%;
      top: -80px; right: -60px; opacity: 0.12; filter: blur(2px);
    }
    .card.c1::after { background: var(--accent); }
    .card.c2::after { background: #6bb5ff; }
    .card.c3::after { background: var(--amber); }
    .card.c4::after { background: var(--coral); }
    .num {
      font-family: Outfit, sans-serif; font-size: 13px; font-weight: 700;
      letter-spacing: 0.08em; margin-bottom: 18px;
    }
    .c1 .num { color: var(--accent); }
    .c2 .num { color: #6bb5ff; }
    .c3 .num { color: var(--amber); }
    .c4 .num { color: var(--coral); }
    .icon {
      width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center;
      font-size: 26px; margin-bottom: 18px;
    }
    .c1 .icon { background: rgba(79, 156, 255, 0.16); }
    .c2 .icon { background: rgba(107, 181, 255, 0.16); }
    .c3 .icon { background: rgba(224, 163, 90, 0.16); }
    .c4 .icon { background: rgba(224, 122, 106, 0.16); }
    .card h2 {
      font-family: Outfit, Noto Sans SC, sans-serif;
      font-size: 28px; font-weight: 700; margin-bottom: 10px;
    }
    .card p { font-size: 15px; color: var(--mist); line-height: 1.55; flex: 1; }
    .card .bar { margin-top: auto; }
    .c1 .bar > i { width: 100%; }
    .c2 .bar > i { width: 68%; }
    .c3 .bar > i { width: 42%; background: linear-gradient(90deg, #b8862e, var(--amber)); }
    .c4 .bar > i { width: 76%; background: linear-gradient(90deg, #c45a4a, var(--coral)); }
  </style>
</head>
<body>
  <header>
    <h1>四种控制方式</h1>
    <p>One palette. Instant airflow.</p>
  </header>
  <div class="grid">
    <article class="card c1">
      <div class="num">01</div>
      <div class="icon">⚡</div>
      <h2>最大转速</h2>
      <p>编译、导出、游戏掉温——一键拉满全部风扇，立刻加压散热。</p>
      <div class="bar"><i></i></div>
    </article>
    <article class="card c2">
      <div class="num">02</div>
      <div class="icon">◎</div>
      <h2>手动调节</h2>
      <p>逐风扇滑动设定 RPM，读数与滑杆实时对应。</p>
      <div class="bar"><i></i></div>
    </article>
    <article class="card c3">
      <div class="num">03</div>
      <div class="icon">↺</div>
      <h2>系统自动</h2>
      <p>随时交还 macOS SMC 温控，安全收尾。</p>
      <div class="bar"><i></i></div>
    </article>
    <article class="card c4">
      <div class="num">04</div>
      <div class="icon">★</div>
      <h2>场景模式</h2>
      <p>按温度曲线运行，支持 App 联动与夜间调度。</p>
      <div class="bar"><i></i></div>
    </article>
  </div>
</body>
</html>
