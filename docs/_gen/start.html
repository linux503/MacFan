<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <title>MacFan Start Poster</title>
  <link rel="stylesheet" href="poster.css" />
  <style>
    body { width: 1400px; height: 720px; }
    .mat { height: 100%; padding: 72px 80px; display: flex; flex-direction: column; }
    .kicker { font-family: var(--display); font-size: 15px; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent-deep); }
    h1 { font-size: 58px; font-weight: 800; letter-spacing: -0.04em; margin: 10px 0 52px; }
    .steps { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 48px; position: relative; }
    .steps::before {
      content: ""; position: absolute; top: 18px; left: 6%; right: 6%; height: 2px;
      background: #16181b; opacity: 0.18;
    }
    .n {
      width: 36px; height: 36px; display: grid; place-items: center;
      font-family: var(--display); font-size: 16px; font-weight: 800; color: #fff; background: var(--accent);
      margin-bottom: 22px; position: relative;
    }
    .s3 .n { background: var(--ink); color: #fff; }
    h2 { font-size: 28px; font-weight: 750; margin-bottom: 12px; }
    p { font-size: 17px; color: #5c646a; line-height: 1.55; max-width: 300px; }
  </style>
</head>
<body class="poster">
  <div class="photo mist" style="background-image:url('bg/mac.jpg')"></div>
  <div class="veil"></div>
  <div class="grain"></div>
  <div class="mat">
    <div class="kicker">Get Started</div>
    <h1>三步上手</h1>
    <div class="steps">
      <article>
        <div class="n">01</div>
        <h2>下载</h2>
        <p>从官网获取 Universal Binary，支持 Apple Silicon 与 Intel。</p>
      </article>
      <article class="s2">
        <div class="n">02</div>
        <h2>拖到应用程序</h2>
        <p>放到 /Applications，去掉隔离属性后打开。</p>
      </article>
      <article class="s3">
        <div class="n">03</div>
        <h2>授权</h2>
        <p>输入系统密码。助手以 LaunchDaemon 运行，真正写入 SMC。</p>
      </article>
    </div>
  </div>
</body>
</html>
