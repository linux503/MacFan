<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <title>MacFan OG</title>
  <link rel="stylesheet" href="base.css" />
  <style>
    body {
      width: 1200px; height: 630px;
      display: grid; grid-template-columns: 1.15fr 0.85fr;
      background:
        radial-gradient(ellipse 70% 80% at 0% 50%, rgba(62,200,220,0.18), transparent 58%),
        linear-gradient(135deg, #05090d 0%, #0b1419 100%);
    }
    .copy { padding: 72px 56px; display: flex; flex-direction: column; justify-content: center; }
    .brand { font-size: 72px; font-weight: 800; letter-spacing: -0.06em; line-height: 0.9; }
    .brand em { font-style: normal; color: var(--accent); }
    .tag { margin-top: 22px; font-size: 22px; color: var(--mist); line-height: 1.4; max-width: 480px; }
    .meta { margin-top: 28px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mist-dim); }
    .preview { display: grid; place-items: center; position: relative; }
    .icon { width: 180px; height: 180px; border-radius: 40px; position: relative; z-index: 1; }
  </style>
</head>
<body>
  <div class="copy">
    <div class="brand">Mac<br><em>Fan</em></div>
    <p class="tag">原生风扇控制。实机读数，一键授权写入 SMC。</p>
    <div class="meta">v1.1.5 · Universal Binary · macOS 14+</div>
  </div>
  <div class="preview">
    <img class="icon" src="../assets/logo-512.png" alt="" />
  </div>
</body>
</html>
