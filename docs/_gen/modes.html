<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <title>MacFan Modes</title>
  <link rel="stylesheet" href="base.css" />
  <style>
    body {
      width: 1400px; height: 900px;
      padding: 52px 60px;
      background:
        radial-gradient(ellipse 65% 50% at 88% 12%, rgba(46, 196, 214, 0.18), transparent 58%),
        radial-gradient(ellipse 40% 35% at 4% 96%, rgba(224, 122, 106, 0.10), transparent 52%),
        linear-gradient(160deg, #0b1419 0%, #05090d 50%, #101a20 100%);
    }
    header { margin-bottom: 40px; }
    header .label { color: var(--accent); margin-bottom: 12px; display: block; }
    header h1 {
      font-family: var(--display);
      font-size: 44px; font-weight: 800; letter-spacing: -0.035em;
    }
    header p { font-size: 15px; color: var(--mist); margin-top: 10px; }
    .grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
    }
    .card {
      border-radius: 20px; padding: 28px 30px; border: 1px solid var(--line-strong);
      background: linear-gradient(155deg, rgba(22, 34, 40, 0.96), rgba(11, 20, 25, 0.90));
      display: flex; flex-direction: column; min-height: 320px;
      position: relative; overflow: hidden;
    }
    .card::before {
      content: ""; position: absolute; inset: 0 auto auto 0; width: 100%; height: 3px;
      background: var(--stripe, var(--accent));
    }
    .card.c1 { --stripe: linear-gradient(90deg, var(--accent-deep), var(--accent)); }
    .card.c2 { --stripe: linear-gradient(90deg, #2ec4d6, #7ad4e4); }
    .card.c3 { --stripe: linear-gradient(90deg, #b8862e, var(--amber)); }
    .card.c4 { --stripe: linear-gradient(90deg, #c45a4a, var(--coral)); }
    .num {
      font-family: var(--display); font-size: 12px; font-weight: 800;
      letter-spacing: 0.1em; margin-bottom: 16px; color: var(--accent);
    }
    .c2 .num { color: #7ad4e4; }
    .c3 .num { color: var(--amber); }
    .c4 .num { color: var(--coral); }
    .icon {
      width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center;
      font-size: 24px; margin-bottom: 16px;
      background: rgba(46, 196, 214, 0.12); border: 1px solid rgba(46, 196, 214, 0.18);
    }
    .c2 .icon { background: rgba(107, 181, 255, 0.12); border-color: rgba(107, 181, 255, 0.18); }
    .c3 .icon { background: rgba(224, 163, 90, 0.12); border-color: rgba(224, 163, 90, 0.18); }
    .c4 .icon { background: rgba(224, 122, 106, 0.12); border-color: rgba(224, 122, 106, 0.18); }
    .card h2 {
      font-family: var(--display);
      font-size: 26px; font-weight: 700; margin-bottom: 10px;
    }
    .card p { font-size: 14px; color: var(--mist); line-height: 1.58; flex: 1; }
    .card .bar { margin-top: auto; }
    .c1 .bar > i { width: 100%; }
    .c2 .bar > i { width: 68%; }
    .c3 .bar > i { width: 42%; background: linear-gradient(90deg, #b8862e, var(--amber)); }
    .c4 .bar > i { width: 76%; background: linear-gradient(90deg, #c45a4a, var(--coral)); }
  </style>
</head>
<body>
  <header>
    <span class="label">Control</span>
    <h1>四种控制方式</h1>
    <p>One palette. Instant airflow.</p>
  </header>
  <div class="grid">
    <article class="card c1">
      <div class="num">01 · MAX</div>
      <div class="icon">⚡</div>
      <h2>最大转速</h2>
      <p>编译、导出、游戏掉温——一键拉满全部风扇，立刻加压散热。</p>
      <div class="bar"><i></i></div>
    </article>
    <article class="card c2">
      <div class="num">02 · MANUAL</div>
      <div class="icon">◎</div>
      <h2>手动调节</h2>
      <p>逐风扇滑动设定 RPM，读数与滑杆实时对应。</p>
      <div class="bar"><i></i></div>
    </article>
    <article class="card c3">
      <div class="num">03 · AUTO</div>
      <div class="icon">↺</div>
      <h2>系统自动</h2>
      <p>随时交还 macOS SMC 温控，安全收尾。</p>
      <div class="bar"><i></i></div>
    </article>
    <article class="card c4">
      <div class="num">04 · SCENES</div>
      <div class="icon">★</div>
      <h2>场景模式</h2>
      <p>按温度曲线运行，支持 App 联动与夜间调度。</p>
      <div class="bar"><i></i></div>
    </article>
  </div>
</body>
</html>
