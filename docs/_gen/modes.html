<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <title>MacFan Modes</title>
  <link rel="stylesheet" href="base.css" />
  <style>
    body {
      width: 1400px; height: 900px; padding: 64px 72px;
      background:
        radial-gradient(ellipse 55% 45% at 100% 0%, rgba(62,200,220,0.16), transparent 55%),
        linear-gradient(165deg, #0b1419 0%, #05090d 100%);
    }
    header { margin-bottom: 48px; }
    header .kicker { font-size: 12px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; display: block; }
    h1 { font-size: 52px; font-weight: 800; letter-spacing: -0.04em; }
    header p { margin-top: 12px; font-size: 18px; color: var(--mist); }
    .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-top: 1px solid var(--line-strong); }
    .col { padding: 36px 28px 8px 0; border-right: 1px solid var(--line); min-height: 520px; }
    .col:last-child { border-right: 0; padding-right: 0; }
    .num { font-size: 13px; font-weight: 700; letter-spacing: 0.16em; color: var(--accent); margin-bottom: 28px; }
    .col.c3 .num, .col.c3 h2 { color: var(--amber); }
    .col.c4 .num, .col.c4 h2 { color: var(--coral); }
    h2 { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 14px; }
    .col p { font-size: 15px; color: var(--mist); line-height: 1.6; max-width: 240px; }
    .meter { margin-top: 48px; height: 4px; background: rgba(255,255,255,0.08); }
    .meter i { display: block; height: 100%; }
    .c1 .meter i { width: 100%; background: var(--accent); }
    .c2 .meter i { width: 68%; background: var(--accent); }
    .c3 .meter i { width: 42%; background: var(--amber); }
    .c4 .meter i { width: 86%; background: var(--coral); }
  </style>
</head>
<body>
  <header>
    <span class="kicker">Control</span>
    <h1>四种控制方式</h1>
    <p>一种直觉。从交还系统到拉满转速。</p>
  </header>
  <div class="row">
    <article class="col c1"><div class="num">01</div><h2>最大转速</h2><p>编译、导出、游戏掉温——一键拉满全部风扇。</p><div class="meter"><i></i></div></article>
    <article class="col c2"><div class="num">02</div><h2>手动调节</h2><p>逐风扇滑动设定 RPM，读数与滑杆实时对应。</p><div class="meter"><i></i></div></article>
    <article class="col c3"><div class="num">03</div><h2>系统自动</h2><p>随时交还 macOS SMC 温控，安全收尾。</p><div class="meter"><i></i></div></article>
    <article class="col c4"><div class="num">04</div><h2>场景模式</h2><p>按温度曲线运行，支持 App 联动与夜间调度。</p><div class="meter"><i></i></div></article>
  </div>
</body>
</html>
