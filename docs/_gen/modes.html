<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <title>MacFan Modes Poster</title>
  <link rel="stylesheet" href="poster.css" />
  <style>
    body { width: 1400px; height: 900px; }
    .mat { height: 100%; padding: 64px 72px 56px; display: flex; flex-direction: column; }
    .kicker { font-family: var(--display); font-size: 15px; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent-deep); }
    h1 { margin: 10px 0 8px; font-size: 64px; font-weight: 800; letter-spacing: -0.04em; line-height: 0.95; }
    .lede { font-size: 20px; color: #5c646a; margin-bottom: 48px; }
    .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-top: 2px solid #16181b; flex: 1; }
    .col { padding: 36px 28px 0 0; }
    .num { font-family: var(--display); font-size: 18px; font-weight: 800; letter-spacing: 0.08em; color: var(--accent-deep); margin-bottom: 24px; }
    .c3 .num, .c3 h2 { color: var(--good); }
    .c4 .num, .c4 h2 { color: var(--coral); }
    h2 { font-size: 30px; font-weight: 750; letter-spacing: -0.03em; margin-bottom: 16px; }
    .col p { font-size: 16px; color: #5c646a; line-height: 1.55; max-width: 240px; }
    .meter { margin-top: 56px; height: 4px; background: rgba(22,24,27,0.12); }
    .meter i { display: block; height: 100%; }
    .c1 .meter i { width: 100%; background: var(--accent); }
    .c2 .meter i { width: 68%; background: var(--accent); }
    .c3 .meter i { width: 42%; background: var(--good); }
    .c4 .meter i { width: 86%; background: var(--coral); }
  </style>
</head>
<body class="poster">
  <div class="photo mist" style="background-image:url('bg/hard.jpg')"></div>
  <div class="veil"></div>
  <div class="grain"></div>
  <div class="mat">
    <div class="kicker">Control</div>
    <h1>四种控制方式</h1>
    <p class="lede">一种直觉。从交还系统到拉满转速。</p>
    <div class="row">
      <article class="col c1"><div class="num">01</div><h2>最大转速</h2><p>编译、导出、游戏掉温——一键拉满全部风扇。</p><div class="meter"><i></i></div></article>
      <article class="col c2"><div class="num">02</div><h2>手动调节</h2><p>逐风扇滑动设定 RPM，读数与滑杆实时对应。</p><div class="meter"><i></i></div></article>
      <article class="col c3"><div class="num">03</div><h2>系统自动</h2><p>随时交还 macOS SMC 温控，安全收尾。</p><div class="meter"><i></i></div></article>
      <article class="col c4"><div class="num">04</div><h2>场景模式</h2><p>按温度曲线运行，支持 App 联动与夜间调度。</p><div class="meter"><i></i></div></article>
    </div>
  </div>
</body>
</html>
