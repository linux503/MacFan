<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <title>MacFan Hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="base.css" />
  <style>
    body {
      width: 1400px;
      height: 900px;
      background: radial-gradient(ellipse 80% 60% at 70% 20%, rgba(79, 156, 255, 0.12), transparent 55%),
                  radial-gradient(ellipse 50% 40% at 10% 90%, rgba(224, 163, 90, 0.06), transparent 50%),
                  var(--ink);
    }
    .window {
      width: 1360px;
      height: 860px;
      margin: 20px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
      display: grid;
      grid-template-rows: 38px 1fr;
      background: var(--canvas);
    }
    .titlebar {
      display: flex;
      align-items: center;
      padding: 0 14px;
      background: rgba(7, 11, 18, 0.85);
      border-bottom: 1px solid var(--line);
      gap: 8px;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.r { background: #ff5f57; }
    .dot.y { background: #febc2e; }
    .dot.g { background: #28c840; }
    .titlebar span { margin-left: 8px; font-size: 12px; color: var(--mist); font-weight: 500; }
    .layout { display: grid; grid-template-columns: 248px 1fr; height: 100%; }
    .sidebar {
      background: rgba(13, 20, 32, 0.94);
      border-right: 1px solid var(--line);
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .brand { display: flex; align-items: center; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
    .brand img { width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--line-strong); }
    .brand h1 { font-family: Outfit, Noto Sans SC, sans-serif; font-size: 18px; font-weight: 700; }
    .brand p { font-size: 10px; color: var(--mist-dim); margin-top: 2px; }
    .section-title { font-size: 10px; font-weight: 600; letter-spacing: 1.5px; color: var(--mist-dim); text-transform: uppercase; margin-bottom: 8px; padding-left: 2px; }
    .mode {
      display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px;
      font-size: 13px; font-weight: 600; margin-bottom: 2px;
    }
    .mode.on { background: var(--accent-soft); color: var(--sand); }
    .mode.off { color: rgba(238, 242, 248, 0.86); }
    .mode .ico {
      width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; font-size: 11px;
    }
    .mode.on .ico { background: var(--accent); color: #071018; }
    .mode.off .ico { background: rgba(33, 48, 68, 0.9); color: var(--mist); }
    .mode .sub { font-size: 10px; font-weight: 400; color: var(--mist-dim); display: block; margin-top: 1px; }
    .mode.on .sub { color: rgba(79, 156, 255, 0.88); }
    .main { padding: 22px 26px; overflow: hidden; display: flex; flex-direction: column; gap: 18px; }
    .admin {
      display: flex; align-items: flex-start; gap: 16px; padding: 18px 20px;
      background: linear-gradient(135deg, rgba(224, 163, 90, 0.10), rgba(24, 34, 51, 0.88));
      border: 1px solid rgba(224, 163, 90, 0.28); border-radius: 16px;
    }
    .admin .lock {
      width: 48px; height: 48px; border-radius: 50%; background: rgba(224, 163, 90, 0.15);
      display: grid; place-items: center; font-size: 22px; flex-shrink: 0;
    }
    .admin h2 { font-family: Outfit, Noto Sans SC, sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .admin p { font-size: 13px; color: var(--mist); line-height: 1.5; max-width: 520px; }
    .admin .btn {
      margin-left: auto; align-self: center; padding: 11px 18px; border-radius: 11px;
      background: var(--accent); color: #071018; font-size: 13px; font-weight: 600; white-space: nowrap;
    }
    .hero-panel {
      padding: 20px 22px; border-radius: 16px; border: 1px solid var(--line);
      background: linear-gradient(145deg, rgba(24, 34, 51, 0.96), rgba(13, 20, 32, 0.92));
      display: flex; align-items: center; gap: 22px;
    }
    .hero-panel h3 { font-family: Outfit, Noto Sans SC, sans-serif; font-size: 28px; font-weight: 700; }
    .hero-panel .desc { font-size: 13px; color: var(--mist); margin-top: 5px; }
    .metrics { display: flex; gap: 0; margin-top: 16px; }
    .metric { padding-right: 16px; margin-right: 16px; border-right: 1px solid var(--line); }
    .metric:last-child { border-right: none; }
    .metric .k { font-size: 10px; font-weight: 600; letter-spacing: 1px; color: var(--mist-dim); text-transform: uppercase; }
    .metric .v { font-family: Outfit, sans-serif; font-size: 20px; font-weight: 700; margin-top: 5px; }
    .gauge {
      width: 120px; height: 120px; margin-left: auto; position: relative; flex-shrink: 0;
    }
    .gauge svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .gauge .center {
      position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    }
    .gauge .fan { font-size: 32px; color: var(--accent); margin-bottom: 2px; }
    .gauge .pct { font-family: Outfit, sans-serif; font-size: 14px; font-weight: 700; color: var(--sand); }
    .fans { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .fan-card {
      padding: 16px 18px; border-radius: 14px; border: 1px solid var(--line);
      background: rgba(24, 34, 51, 0.75);
    }
    .fan-card header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    .fan-card h4 { font-size: 14px; font-weight: 600; }
    .fan-card .rpm { font-family: Outfit, sans-serif; font-size: 22px; font-weight: 700; color: var(--accent); }
    .fan-card .sub { font-size: 11px; color: var(--mist-dim); margin-top: 2px; }
    .slider { height: 6px; border-radius: 99px; background: rgba(255,255,255,0.06); margin-top: 10px; position: relative; }
    .slider i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent-deep), var(--accent)); }
    .slider b { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 14px; height: 14px; border-radius: 50%; background: var(--sand); box-shadow: 0 0 0 3px var(--accent); }
    .chart {
      flex: 1; min-height: 0; padding: 16px 18px; border-radius: 14px; border: 1px solid var(--line);
      background: rgba(24, 34, 51, 0.55); position: relative;
    }
    .chart h4 { font-size: 12px; font-weight: 600; color: var(--mist); margin-bottom: 10px; }
    .chart svg { width: 100%; height: calc(100% - 24px); }
  </style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
      <span>MacFan</span>
    </div>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <img src="../assets/logo-512.png" alt="" />
          <div>
            <h1>MacFan</h1>
            <p>精准控制 Mac 风扇</p>
          </div>
        </div>
        <div>
          <div class="section-title">控制</div>
          <div class="mode off"><div class="ico">⚡</div><div><div>最大转速</div><span class="sub">全部风扇拉满</span></div></div>
          <div class="mode off"><div class="ico">◎</div><div><div>手动调节</div><span class="sub">逐风扇设定 RPM</span></div></div>
          <div class="mode off"><div class="ico">↺</div><div><div>系统自动</div><span class="sub">交还 macOS SMC</span></div></div>
          <div class="mode on"><div class="ico">★</div><div><div>场景模式</div><span class="sub">智能温度曲线</span></div></div>
        </div>
        <div>
          <div class="section-title">扩展</div>
          <div style="font-size:12px;color:var(--mist);padding:8px 10px;">App 联动 · 夜间调度</div>
        </div>
      </aside>
      <main class="main">
        <div class="admin">
          <div class="lock">🔒</div>
          <div>
            <h2>需要管理员权限</h2>
            <p>写入 SMC 才能真正调速。点击后输入密码授权，界面不用重启。</p>
          </div>
          <div class="btn">🔑 授权管理员权限</div>
        </div>
        <div class="hero-panel">
          <div>
            <h3>创作渲染</h3>
            <div class="desc">Xcode / Final Cut 自动加压散热</div>
            <div class="metrics">
              <div class="metric"><div class="k">CPU</div><div class="v" style="color:#5ec4a8">47°</div></div>
              <div class="metric"><div class="k">GPU</div><div class="v" style="color:#5ec4a8">52°</div></div>
              <div class="metric"><div class="k">机身</div><div class="v" style="color:#e0a35a">58°</div></div>
              <div class="metric"><div class="k">热状态</div><div class="v" style="color:#e0a35a">偏热</div></div>
            </div>
          </div>
          <div class="gauge">
            <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#213044" stroke-width="7"/><circle cx="60" cy="60" r="52" fill="none" stroke="url(#g)" stroke-width="7" stroke-linecap="round" stroke-dasharray="245 327"/></svg>
            <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e0a35a"/><stop offset="100%" stop-color="#4f9cff"/></linearGradient></defs>
            <div class="center"><div class="fan">🌀</div><div class="pct">62%</div></div>
          </div>
        </div>
        <div class="fans">
          <div class="fan-card">
            <header><div><h4>风扇 1</h4><div class="sub">CPU 侧</div></div><div class="rpm">2,460</div></header>
            <div class="slider"><i style="width:62%"></i><b style="left:62%"></b></div>
          </div>
          <div class="fan-card">
            <header><div><h4>风扇 2</h4><div class="sub">GPU 侧</div></div><div class="rpm">2,180</div></header>
            <div class="slider"><i style="width:55%"></i><b style="left:55%"></b></div>
          </div>
        </div>
        <div class="chart">
          <h4>温度曲线 · 最近 30 分钟</h4>
          <svg viewBox="0 0 900 120" preserveAspectRatio="none">
            <defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(79,156,255,0.35)"/><stop offset="100%" stop-color="rgba(79,156,255,0)"/></linearGradient></defs>
            <path d="M0,90 L60,82 L120,78 L180,85 L240,70 L300,62 L360,58 L420,65 L480,55 L540,48 L600,52 L660,45 L720,50 L780,42 L840,38 L900,35 L900,120 L0,120 Z" fill="url(#fill)"/>
            <path d="M0,90 L60,82 L120,78 L180,85 L240,70 L300,62 L360,58 L420,65 L480,55 L540,48 L600,52 L660,45 L720,50 L780,42 L840,38 L900,35" fill="none" stroke="#4f9cff" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
